<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alfred — Configurações</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <div class="mark">A</div>
    <p class="eyebrow">ALFRED LOCAL COPILOT</p>
    <h1>Configurações</h1>
    <p class="lead">O endpoint e as mensagens ficam no seu computador. Por padrão, Alfred conversa com o Ollama local.</p>
    <form id="settings">
      <label>Endpoint do Ollama<input id="endpoint" type="url" placeholder="http://127.0.0.1:11434" required></label>
      <label>Modelo<input id="model" type="text" placeholder="qwen3.5:4b" required></label>
      <div class="actions"><button type="button" id="test">Testar conexão</button><button type="submit">Salvar</button></div>
      <p id="status" role="status"></p>
    </form>
    <aside><b>Preparação rápida</b><code>ollama pull qwen3.5:4b</code><code>ollama serve</code></aside>
  </main>
  <script src="options.js"></script>
</body>
</html>
